<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosa direbbe Maicol Banoffe?</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin-top: 10vh;
            background-color: #f9f9fb;
            color: #333;
        }
        h1 {
            font-size: 2.5rem;
            color: #2c3e50;
        }
        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            background-color: #ff6f61;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 20px;
        }
        button:hover {
            background-color: #e55b4f;
        }
        button:active {
            transform: translateY(2px);
        }
        #risultato {
            margin-top: 40px;
            font-size: 1.8rem;
            font-weight: bold;
            font-style: italic;
            color: #007b5e;
            padding: 0 20px;
        }
    </style>
</head>
<body>

    <h1>Cosa direbbe Maicol Banoffe?</h1>
    <button onclick="generaFrase()">Scoprilo</button>
    
    <!-- Qui apparirà la frase generata -->
    <p id="risultato"></p>

    <script>
        // LISTA DELLE FRASI
        // Puoi aggiungere quante frasi vuoi qui sotto. 
        // Ricordati di metterle tra virgolette e separate da una virgola!
        const frasi = [
            "sto parcheggiando",
            "io mi candido",
            "il mirtillo voglio",
            "posso sapere a che ora finisce?",
            "ma cè la pausa pranzo",
            "ma che è national geographic",
            "il Pikachu di Bainsizza",
            "sono stato scoperto",
            "sono quasi arrivato",
            "cosa si rischia?",
            "non avrò pace",
            "non so se è un problema",
            "io e bax stiamo arrivando, passiamo per santiago de compostela",
            "la side più normale del venerdì sera",
            "la mia intera vita sentimentale poggia su questo baffo",
            "per scopi utili alla scienza",
            " screenshot da vinted ",
            "incredibile",
            "prendo nota",
            "sto parcheggiando",
            "sto parcheggiando",
            "però anzichè vincere ti portano alla bancarotta assoluta",
            "avrei detto altro",
            "che pokemon è quello?",
            "tra il prize check di questa lista e la sedia elettrica non avrei dubbi",
            "dio delle città",
            ""
        ];

        function generaFrase() {
            // Sceglie un numero casuale basato sulla lunghezza della lista
            const indiceCasuale = Math.floor(Math.random() * frasi.length);
            // Mostra la frase corrispondente a quel numero
            document.getElementById('risultato').innerText = "\"" + frasi[indiceCasuale] + "\"";
        }
    </script>

</body>
</html>
